# CF e CE de texto igual (laboratório das remissões, o49; opção (a) aprovada pelo usuário em 27/10/2026)
#
# A CE copia muitas regras da CF trocando os órgãos (Assembleia por Congresso, Governador por Presidente). Quando um
# dispositivo do RI ou da LOM tem correlato, do mesmo tipo, com a CF e com a CE de um par desta lista, o site mostra
# um selo só, com os dois links, a nota da CF e "A CE repete a regra, para o Estado.". Os pares saíram do critério
# da L200 (semelhança de palavras de 0,6 ou mais) e passaram por um cético que leu os dois textos: ficaram só os que
# repetem a regra (79 de 120); os 41 em que a CE muda algo (quórum, prazo, item, ressalva) ficam com dois selos.
# Endereços como na planilha remissoes.xlsx.

