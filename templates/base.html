<body>

<!-- THE STRIP ABOVE THE HEADER: the pill between the two sites. It scrolls
     away; while it shows, what hangs from the header goes lower (03-trilha.js) -->
<nav id="site-strip" aria-label="Escolher o site">
  <div class="site-switch" data-cur="rg">
    <span class="thumb" aria-hidden="true"></span>
    <a class="opt opt-ps" href="https://leisp.com.br/">Pesquisa</a>
    <span class="opt opt-rg" aria-current="page">Regimento</span>
  </div>
  <div class="msg">Aceito sugestões! <span class="msg-name">Kauê Negrão</span></div>
  <script>
  // A click anywhere on the pill, the chosen side too: it slides, then the
  // other site opens. Back from it the browser may bring this page whole from
  // its memory, so the pill comes back too
  (function () {
    var sw = document.querySelector('#site-strip .site-switch');
    sw.addEventListener('click', function (e) {
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      e.preventDefault();
      var href = sw.querySelector('a').href;
      sw.dataset.cur = 'ps';
      setTimeout(function () { location.href = href; }, 260);
    });
    addEventListener('pageshow', function () { sw.dataset.cur = 'rg'; });
  })();
  </script>
</nav>

<!-- HEADER -->
<div id="header">
  <button id="btn-index" title="Índice" aria-label="Índice" aria-controls="index-panel" aria-expanded="false">☰</button>
  <script>
  // The header shows seconds before the page's script runs (it comes after
  // the cards): a tap on ☰ meanwhile is answered at once and remembered, and
  // the index opens as soon as the script runs (19-inicio-da-pagina.js)
  document.getElementById('btn-index').addEventListener('click', window.earlyIndex = function (e) {
    this.classList.add('pending');
    window.earlyIndex.asked = e.timeStamp || performance.now();   // (when: ?medir, 12-painel-do-indice.js)
  });
  // A finger's tap on a button doesn't put the focus on it (as on an iPhone):
  // on an Android phone the page's first focus on a button froze it for 2.5 s
  // (the browser's own work, measured with ?medir&sem=foco), the ☰'s first
  // opening above all. A field being typed in loses it, as before (the
  // keyboard closes); Tab still goes to the buttons
  document.addEventListener('mousedown', function (e) {
    if (!(e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)
        || !e.target.closest || !e.target.closest('button, [role="button"], #site-strip a')) return;
    e.preventDefault();
    var typing = document.activeElement;
    if (typing && typing.matches('input, textarea')) typing.blur();
  }, true);
  </script>
  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="Buscar... (ex: r43 vai ao Art. 43 do RI, l43 ao da LOM)" autocomplete="off" enterkeyhint="search">
    <span id="search-chip" hidden><span id="chip-label"></span><button id="chip-remove" type="button" title="Tirar o assunto da busca" aria-label="Tirar o assunto da busca">&times;</button></span>
    <div id="search-nav">
      <button id="search-counter" type="button" title="Lista de resultados" aria-controls="results-panel" aria-expanded="false"></button>
      <button class="search-arrow" id="search-prev">&#8249;</button>
      <button class="search-arrow" id="search-next">&#8250;</button>
    </div>
    <button id="btn-clear-search" title="Limpar busca">&times;</button>
    <button id="btn-filter" class="active" title="Filtrar resultados"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 1h14L10 7v5l-4 2V7z"/></svg></button>
  </div>
  <button id="btn-compact" title="Modo compacto"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l5 5m0-3v3h-3M16 2l-5 5m0-3v3h3M2 16l5-5m-3 0h3v3M16 16l-5-5m3 0h-3v3"/></svg></button>
</div>

<!-- BREADCRUMB (scroll context) -->
<div id="breadcrumb-bar"><div id="breadcrumb"></div></div>

<!-- READING LINE -->
<div id="reading-line"></div>

<!-- CARDS -->
<div id="cards-container">
<p id="aviso">Ferramenta não oficial. Confira o texto no Diário Oficial.</p>
{{CARDS}}
</div>

<!-- Everything that floats over the cards, in a box of its own: shown or
     hidden straight among <body>'s children, each would have the browser
     send the whole page's accessibility tree again (~1 s on a PC, seconds on
     a phone), whenever an accessibility service is on: a screen reader, but
     also a password manager. The script's own (rem-pop…) go in it too -->
<div id="layers">

<!-- FLOATING MARKER NAV (dynamically populated) -->
<div id="marker-nav"></div>
<div id="marker-tooltip"></div>
<div id="marker-undo" hidden><span></span><button type="button">Desfazer</button></div>
<div id="footnote-tooltip"></div>

<!-- INDEX OVERLAY -->
<div id="index-overlay"></div>

<!-- INDEX PANEL -->
<div id="index-panel">
  <div id="index-header">
    <button id="index-results-link" hidden></button>
    <div id="index-tabs-row">
      <div id="index-tabs">
        <button class="index-tab active" data-tab="systematic">Sistemático</button>
        <button class="index-tab" data-tab="subject">Remissivo</button>
        <button class="index-tab" data-tab="references">Referências</button>
      </div>
      <button id="btn-info-tab" data-tab="info" title="Informações">i</button>
      <button id="index-close" type="button" title="Fechar o índice" aria-label="Fechar o índice">&times;</button>
    </div>
    <div id="index-search-wrapper">
      <input id="index-search" type="text" placeholder="Pesquisar no índice...">
      <button id="btn-clear-index-search" title="Limpar pesquisa">&times;</button>
    </div>
  </div>
  <div id="index-content"></div>
</div>

<!-- SEARCH RESULTS LIST (sidebar on wide screens, drawer on small ones) -->
<div id="results-panel" role="region" aria-label="Resultados da busca">
  <div id="results-header">
    <span id="results-title">Resultados</span>
    <span id="results-summary"></span>
    <button id="results-close" title="Fechar lista de resultados" aria-label="Fechar lista de resultados">&times;</button>
  </div>
  <div id="results-list"></div>
</div>

<!-- MINIMAP -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-viewport"></div>
  <div id="minimap-highlight"></div>
  <div id="minimap-tooltip"></div>
</div>

<!-- SEARCH SCROLLBAR TICKS -->
<div id="search-ticks"></div>
<div id="search-tick-tooltip"></div>

<!-- ZOOM INDICATOR -->
<div id="zoom-indicator"></div>

</div>

{{JS}}
</script>
