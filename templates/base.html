<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RegimentoReader — Câmara Municipal de São Paulo</title>
<meta name="description" content="Regimento Interno da Câmara Municipal de São Paulo ligado à Lei Orgânica e às Constituições Estadual e Federal, com índice remissivo, consulta rápida e busca.">
<meta name="theme-color" content="#252839">
<!-- the link's preview (WhatsApp, e-mail…): static/img, regenerated by static/img/_gerar.py -->
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Regimento Interno referenciado — Câmara Municipal de São Paulo">
<meta property="og:description" content="Regimento Interno da Câmara Municipal de São Paulo ligado à Lei Orgânica e às Constituições Estadual e Federal, com índice remissivo, consulta rápida e busca.">
<meta property="og:url" content="https://prototiposlegisla.github.io/regimento/">
<meta property="og:image" content="https://prototiposlegisla.github.io/regimento/img/compartilhar.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Regimento Interno referenciado: RI, LOM, CE e CF">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23252839'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='21' font-weight='700' fill='%23fff' text-anchor='middle'%3ER%3C/text%3E%3Crect x='5' y='25.5' width='5.5' height='2.5' fill='%237d93bd'/%3E%3Crect x='10.5' y='25.5' width='5.5' height='2.5' fill='%2394b06e'/%3E%3Crect x='16' y='25.5' width='5.5' height='2.5' fill='%235fa7ab'/%3E%3Crect x='21.5' y='25.5' width='5.5' height='2.5' fill='%23cf9a52'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="img/icone-180.png">
<style>
{{CSS}}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <button id="btn-index" title="Índice" aria-label="Índice" aria-controls="index-panel" aria-expanded="false">☰</button>
  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="Buscar... (ex: r43 vai ao Art. 43 do RI, l43 ao da LOM)" autocomplete="off" enterkeyhint="search">
    <span id="search-chip" hidden><span id="chip-label"></span><button id="chip-remove" type="button" title="Tirar o assunto da busca" aria-label="Tirar o assunto da busca">&times;</button></span>
    <div id="search-nav">
      <button id="search-counter" type="button" title="Lista de resultados" aria-controls="results-panel" aria-expanded="false"></button>
      <button class="search-arrow" id="search-prev">&#8249;</button>
      <button class="search-arrow" id="search-next">&#8250;</button>
    </div>
    <button id="btn-clear-search" title="Limpar busca">&times;</button>
    <button id="btn-filter" class="active" title="Filtrar resultados"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 1h14L10 7v5l-4 2V7z"/></svg></button>
  </div>
  <button id="btn-compact" title="Modo compacto"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l5 5m0-3v3h-3M16 2l-5 5m0-3v3h3M2 16l5-5m-3 0h3v3M16 16l-5-5m3 0h-3v3"/></svg></button>
</div>

<!-- BREADCRUMB (scroll context) -->
<div id="breadcrumb-bar"><div id="breadcrumb"></div></div>

<!-- READING LINE -->
<div id="reading-line"></div>

<!-- CARDS -->
<div id="cards-container">
{{CARDS}}
</div>

<!-- FLOATING MARKER NAV (dynamically populated) -->
<div id="marker-nav"></div>
<div id="marker-tooltip"></div>
<div id="footnote-tooltip"></div>

<!-- INDEX OVERLAY -->
<div id="index-overlay"></div>

<!-- INDEX PANEL -->
<div id="index-panel">
  <div id="index-header">
    <button id="index-results-link" hidden></button>
    <div id="index-tabs-row">
      <div id="index-tabs">
        <button class="index-tab active" data-tab="systematic">Sistemático</button>
        <button class="index-tab" data-tab="subject">Remissivo</button>
        <button class="index-tab" data-tab="references">Referências</button>
      </div>
      <button id="btn-info-tab" data-tab="info" title="Informações">i</button>
    </div>
    <div id="index-search-wrapper">
      <input id="index-search" type="text" placeholder="Pesquisar no índice...">
      <button id="btn-clear-index-search" title="Limpar pesquisa">&times;</button>
    </div>
  </div>
  <div id="index-content"></div>
</div>

<!-- SEARCH RESULTS LIST (sidebar on wide screens, drawer on small ones) -->
<div id="results-panel" role="region" aria-label="Resultados da busca">
  <div id="results-header">
    <span id="results-title">Resultados</span>
    <span id="results-summary"></span>
    <button id="results-close" title="Fechar lista de resultados" aria-label="Fechar lista de resultados">&times;</button>
  </div>
  <div id="results-list"></div>
</div>

<!-- MINIMAP -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-viewport"></div>
  <div id="minimap-highlight"></div>
  <div id="minimap-tooltip"></div>
</div>

<!-- SEARCH SCROLLBAR TICKS -->
<div id="search-ticks"></div>
<div id="search-tick-tooltip"></div>

<!-- ZOOM INDICATOR -->
<div id="zoom-indicator"></div>

{{DATA}}
<script>
{{JS}}
</script>
</body>
</html>
