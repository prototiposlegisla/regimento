# Entradas do índice remissivo com listas parecidas de propósito.
#
# Regra do índice: um tema, uma casa. O tema fica detalhado numa entrada e as outras ficam
# com a linha e um vide para ela (SESSÃO ORDINÁRIA — Grande Expediente → GRANDE EXPEDIENTE),
# porque listas copiadas acabam divergindo. O build avisa (categoria "duplicatas") quando duas
# entradas de assuntos diferentes têm a mesma lista, ou quando uma tem o nome contido no da
# outra e ≥ 80% da lista dela (src/parse_xlsx.duplicatas). Os espelhos que o build reconhece
# sozinho (LEI — Promulgação × PROMULGAÇÃO — De Lei) já ficam de fora.
#
# Declare aqui só o que fica de propósito:
#
#   [[espelho]]    o cruzamento de dois conceitos visto de cada lado, com nomes que o build não
#                  reconhece como espelho: as entradas levam os mesmos dispositivos, e o build
#                  confere (categoria "espelhos");
#   [[distintos]]  temas diferentes que coincidem nos dispositivos (entes diferentes sob a mesma
#                  regra, um recorte de um tema mais amplo): cada um fica com a sua lista.
#
# entradas: os nomes como no site, "ASSUNTO — Subassunto" ou "ASSUNTO"; num grupo com mais de
#           duas, vale para todos os pares
# motivo:   por que ficam assim
#
# O build avisa quando um nome daqui não está no índice (foi renomeado ou remetido).

