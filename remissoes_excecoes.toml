# Ajustes da detecção automática de remissões explícitas (src/remissoes.py).
#
# O build acha sozinho as citações a outros dispositivos ("artigo 369", "§ 1º do
# artigo 368", "artigo 73 da Lei Orgânica") e mostra no site uma prévia do texto
# citado. Use este arquivo só quando a detecção errar:
#
#   [[ignorar]]  descarta uma citação detectada;
#   [[definir]]  diz para onde aponta uma citação (troca a detectada ou acrescenta).
#
# origem: o dispositivo onde está a citação, no formato do site:
#         "262" (caput do art. 262 do Regimento), "18,VI", "LOM:42,§ 7º", "LOM:ADT29",
#         "PREC:1/2002" (um precedente regimental: o trecho é procurado no texto todo dele)
# trecho: o texto da citação, como está no dispositivo
# alvos:  os dispositivos citados, no mesmo formato da origem
#
# O build avisa quando uma exceção não encontra a origem ou o trecho.

[[definir]]
origem = "262"
trecho = "parágrafo segundo do artigo anterior"
alvos = ["261,§ 2º"]
motivo = "ordinal por extenso ('parágrafo segundo'), que a detecção não lê"

[[definir]]
origem = "LOM:ADT29"
trecho = "art. 26"
alvos = ["LOM:ADT26"]
motivo = "nas Disposições Gerais e Transitórias, 'art. 26' é o art. 26 das próprias DGT (Emenda 41/2021), não o art. 26 da LOM"

[[definir]]
origem = "PREC:1/2002"
trecho = "344 do Regimento Interno"
alvos = ["344"]
motivo = "'artigos 140 da Lei Orgânica do Município e 344 do Regimento Interno': o segundo artigo vem depois do qualificador da LOM"

[[definir]]
origem = "CF:29,XIV"
trecho = "art. 28, parágrafo único"
alvos = ["CF:28,§ 1º"]
motivo = "o parágrafo único do art. 28 foi renumerado § 1º pela EC 19/1998; o texto do Planalto do art. 29, XIV não foi atualizado"

[[definir]]
origem = "LOM:96,§ú"
trecho = "X, XII, XIII, XV, XVI, XVII, XVIII, XIX, XX, XXII, XXIII, XXV, XXVI, XXVII, XXVIII, XXX e XXXI"
alvos = ["CF:7,X", "CF:7,XII", "CF:7,XIII", "CF:7,XV", "CF:7,XVI", "CF:7,XVII", "CF:7,XVIII", "CF:7,XIX", "CF:7,XX", "CF:7,XXII", "CF:7,XXIII", "CF:7,XXV", "CF:7,XXVI", "CF:7,XXVII", "CF:7,XXVIII", "CF:7,XXX", "CF:7,XXXI"]
motivo = "'IX. X': o ponto no lugar da vírgula (está no texto oficial) interrompe a lista de incisos do art. 7º da CF"
