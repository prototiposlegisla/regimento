# Busca pela forma certa dos erros do texto oficial (laboratório das remissões, o81; aprovado pelo usuário em 27/10/2026)
#
# O texto do site fica fiel à fonte (PLP, ALESP): o erro de digitação que está lá não se corrige no DOCX
# ("Erros no texto das normas.md", em FontesAtual). Mas o erro esconde o dispositivo de quem busca a palavra certa
# ("prorrogação" não acha o art. 144, que diz "prorrogração"). Para cada erro desta lista, o build grava a forma certa
# no card do artigo (data-busca), que a busca lê junto com o texto; o leitor continua vendo o texto fiel.
#
# norma: RI, LOM, CE; art: como no card (data-art: "144", "183-A", "ADT1"); errado: o trecho como está no texto (o
# build avisa se não o achar mais, porque o erro pode ter sido corrigido na fonte); certo: a forma que a busca acha.
# Erros só de acento ficam fora: a busca já os ignora.

# Seção 1 de "Erros no texto das normas.md": digitação (o78, L408)
