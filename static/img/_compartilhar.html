<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<style>
@font-face { font-family: "EB Garamond"; font-weight: 400 800; src: url(../fonts/eb-garamond-latin.woff2) format("woff2"); }
@font-face { font-family: "Merriweather Sans"; font-weight: 400 700; src: url(../fonts/merriweather-sans-latin.woff2) format("woff2"); }
@font-face { font-family: "Cinzel"; font-weight: 400 900; src: url(../fonts/cinzel-latin.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; background: #252839; color: #fff; position: relative;
  font-family: "Merriweather Sans", sans-serif; }
.marca { position: absolute; right: -40px; bottom: -150px; font: 700 560px/1 "EB Garamond", serif; color: rgba(255,255,255,.05); letter-spacing: -.04em; }
.conteudo { position: absolute; left: 90px; top: 92px; right: 90px; }
.casa { font: 600 22px/1.3 "Cinzel", serif; letter-spacing: .22em; color: #c9cede; }
h1 { margin-top: 26px; font: 500 86px/1.02 "EB Garamond", serif; letter-spacing: -.01em; }
.sub { margin-top: 28px; font: 400 27px/1.45 "Merriweather Sans", sans-serif; color: #dfe2ea; max-width: 860px; }
.normas { position: absolute; left: 90px; bottom: 74px; display: flex; gap: 14px; }
.normas span { font: 700 22px/1 "Merriweather Sans", sans-serif; letter-spacing: .06em; padding: 12px 20px; border-radius: 10px; color: #fff; }
.faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; display: flex; }
.faixa i { flex: 1; }
</style></head>
<body>
<div class="marca">RI</div>
<div class="conteudo">
  <div class="casa">Câmara Municipal de São Paulo</div>
  <h1>Regimento Interno<br>referenciado</h1>
  <p class="sub">Ligado à Lei Orgânica e às Constituições, com índice remissivo, consulta rápida e busca.</p>
</div>
<div class="normas"><span style="background:#4a5f86">RI</span><span style="background:#5f7a3e">LOM</span><span style="background:#2b6f74">CE</span><span style="background:#9a6b2c">CF</span></div>
<div class="faixa"><i style="background:#4a5f86"></i><i style="background:#5f7a3e"></i><i style="background:#2b6f74"></i><i style="background:#9a6b2c"></i></div>
</body></html>
